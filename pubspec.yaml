name: mamba_fast_tracker
description: "Mamba Fast Tracker - Jejum intermitente + calorias. Desafio Mamba Growth."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  hive: ^2.2.3
  hive_ce: ^2.19.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  fl_chart: ^0.71.0
  intl: ^0.20.2
  uuid: ^4.5.1
  shared_preferences: ^2.3.3
  google_fonts: ^6.2.1
  http: ^1.6.0
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  firebase_analytics: ^12.5.0
  firebase_crashlytics: ^5.3.0
  google_sign_in: ^7.2.0
  flutter_secure_storage: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon_foreground.png
  adaptive_icon_background: "#F1F8F1"
  adaptive_icon_foreground: assets/icon_foreground.png
  min_sdk_android: 21

flutter:
  uses-material-design: true
